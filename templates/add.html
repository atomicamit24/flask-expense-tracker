{% extends "base.html" %}

{% block title %}Add Expense &bull; Expense Tracker{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <!-- Card Container -->
    <div class="bg-white rounded-3xl border border-slate-100 shadow-card p-6 sm:p-8">
        <!-- Card Header with Back Link -->
        <div class="flex items-center justify-between pb-6 mb-6 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <a href="{{ url_for('index') }}" class="w-10 h-10 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition-colors" title="Back to Dashboard">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </a>
                <div>
                    <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Add an Expense</h1>
                    <p class="text-xs text-slate-400 font-medium">Record a new outgoing transaction</p>
                </div>
            </div>

            <span class="text-xs font-bold text-purple-600 bg-purple-50 px-3 py-1 rounded-full">New Entry</span>
        </div>

        <!-- Form Body -->
        <form action="{{ url_for('add_expense') }}" method="POST" class="space-y-5">
            <!-- Expense Title -->
            <div>
                <label for="title" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                    Title <span class="text-rose-500">*</span>
                </label>
                <input 
                    type="text" 
                    id="title" 
                    name="title" 
                    placeholder="e.g. Groceries at Market, Uber Ride" 
                    required 
                    maxlength="120"
                    autofocus
                    class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200/80 text-sm font-semibold text-slate-800 placeholder:text-slate-400 placeholder:font-normal focus:bg-white focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-500/10 transition-all"
                >
            </div>

            <!-- Amount and Category Row -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Amount -->
                <div>
                    <label for="amount" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Amount ($) <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 font-extrabold text-sm">$</span>
                        <input 
                            type="number" 
                            id="amount" 
                            name="amount" 
                            placeholder="0.00" 
                            step="0.01" 
                            min="0.01" 
                            required
                            class="w-full pl-8 pr-4 py-3 rounded-2xl bg-slate-50 border border-slate-200/80 text-sm font-bold text-slate-900 placeholder:text-slate-400 placeholder:font-normal focus:bg-white focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-500/10 transition-all"
                        >
                    </div>
                </div>

                <!-- Category -->
                <div>
                    <label for="category" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                        Category <span class="text-rose-500">*</span>
                    </label>
                    <select 
                        id="category" 
                        name="category" 
                        required
                        class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200/80 text-sm font-bold text-slate-800 focus:bg-white focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-500/10 transition-all cursor-pointer"
                    >
                        {% for cat in categories %}
                            <option value="{{ cat }}">
                                {% if cat == 'Food' %}🍔 Food
                                {% elif cat == 'Travel' %}✈️ Travel
                                {% elif cat == 'Utilities' %}💡 Utilities
                                {% else %}📦 Others{% endif %}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Spent On Date -->
            <div>
                <label for="spent_on" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                    Date Spent On <span class="text-rose-500">*</span>
                </label>
                <input 
                    type="date" 
                    id="spent_on" 
                    name="spent_on" 
                    value="{{ today_date }}" 
                    required
                    class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200/80 text-sm font-semibold text-slate-800 focus:bg-white focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-500/10 transition-all"
                >
            </div>

            <!-- Description -->
            <div>
                <label for="description" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                    Description <span class="text-slate-400 font-normal lowercase">(optional)</span>
                </label>
                <textarea 
                    id="description" 
                    name="description" 
                    rows="3" 
                    placeholder="Add details, notes, or receipts..."
                    class="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200/80 text-sm text-slate-800 placeholder:text-slate-400 focus:bg-white focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-500/10 transition-all resize-y"
                ></textarea>
            </div>

            <!-- Form Actions -->
            <div class="flex items-center gap-3 pt-3">
                <button type="submit" class="flex-1 inline-flex items-center justify-center gap-2 bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold text-sm py-3.5 px-6 rounded-2xl shadow-purple-glow active:scale-[0.98] transition-all cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span>Save Expense</span>
                </button>
                <a href="{{ url_for('index') }}" class="inline-flex items-center justify-center py-3.5 px-6 rounded-2xl text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 hover:text-slate-900 transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
